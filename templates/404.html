{% extends "base.html" %}

{% block title %}Страница не найдена — {{ site_title }}{% endblock %}

{% block content %}
<section class="section">
    <div class="wrap center">
        <div class="error-code">404</div>
        <h1 class="sec-title">Страница не найдена</h1>
        <p class="sec-lead">Возможно, страница перемещена или ссылки больше нет.</p>
        <a class="btn btn--primary" href="{% url 'core:home' %}">На главную</a>
    </div>
</section>
{% endblock %}
