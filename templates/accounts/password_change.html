{% extends "base.html" %}

{% block title %}Смена пароля — {{ site_title }}{% endblock %}

{% block content %}
<section class="section">
    <div class="wrap wrap--form">
        <h1 class="sec-title">Смена пароля</h1>
        <form class="card" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn--primary btn--block" type="submit">Сменить пароль</button>
        </form>
    </div>
</section>
{% endblock %}
