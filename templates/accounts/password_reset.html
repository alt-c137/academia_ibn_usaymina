{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<section class="section">
    <div class="wrap wrap--form">
        <h1 class="sec-title">Восстановление пароля</h1>
        <p class="sec-lead">Укажите e-mail — отправим ссылку для смены пароля.</p>

        <form class="card" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn--primary btn--block" type="submit">Отправить письмо</button>
        </form>
    </div>
</section>
{% endblock %}
