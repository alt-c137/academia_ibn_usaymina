{% extends "base.html" %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<section class="section">
    <div class="wrap wrap--form">
        <h1 class="sec-title">Новый пароль</h1>

        <form class="card" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn--primary btn--block" type="submit">Установить пароль</button>
        </form>
    </div>
</section>
{% endblock %}
