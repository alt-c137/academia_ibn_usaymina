{% comment %}Сообщения Django (успех/ошибка/подсказка) — лента под шапкой.{% endcomment %}
{% if messages %}
    <div class="wrap">
        {% for message in messages %}
            <div class="msg msg--{{ message.tags|default:'info' }}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}
